<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="robots" content="noindex">
<title>Tiempos</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilos.css?v=21">
</head>
<body>
<header id="barra"><span class="marca">Tiempos</span><span id="quien" class="gris"></span></header>
<main class="contenedor">
  <p id="aviso" class="aviso" hidden></p>

  <section id="cargando"><p class="gris">Cargando…</p></section>

  <section id="entrar" hidden>
    <h1>Entrar</h1>
    <p class="gris">Con la misma cuenta de Casa Verde: entra a las dos.</p>
    <form id="form-entrar">
      <label>Mail <input id="mail" type="email" autocomplete="username" required></label>
      <label>Contraseña <input id="clave" type="password" autocomplete="current-password" required></label>
      <button class="boton" id="btn-entrar">Entrar</button>
    </form>
    <button class="link" id="olvide">Olvidé la contraseña</button>
  </section>

  <section id="acceso" hidden>
    <h1>Pedir acceso</h1>
    <p id="acceso-estado" class="gris"></p>
    <form id="form-acceso">
      <label>Tu nombre <input id="acceso-nombre" maxlength="40" required></label>
      <button class="boton">Pedir acceso</button>
    </form>
    <button class="link" data-salir>Salir</button>
  </section>

  <section id="app" hidden>
    <nav class="solapas" role="tablist">
      <button data-solapa="pizarra" role="tab" aria-selected="true">Pizarra</button>
      <button data-solapa="tareas" role="tab" aria-selected="false">Tareas</button>
      <button data-solapa="hoy" role="tab" aria-selected="false">Hoy</button>
      <button data-solapa="agenda" role="tab" aria-selected="false">Agenda</button>
      <button data-solapa="chicos" role="tab" aria-selected="false">Chicos</button>
      <button data-solapa="plata" role="tab" aria-selected="false">Plata</button>
      <button data-solapa="balance" role="tab" aria-selected="false">Balance</button>
    </nav>
    <div id="crono" class="tarjeta"></div>
    <div id="cuidado" class="tarjeta chica"></div>
    <p id="cv-estado" class="gris"></p>
    <form id="form-cv" class="tarjeta" hidden>
      <label>Contraseña de Casa Verde <input id="cv-clave" type="password" autocomplete="current-password" required></label>
      <button class="boton sec">Entrar a Casa Verde</button>
    </form>

    <div id="v-pizarra"></div>
    <div id="v-ahora" hidden></div>
    <div id="v-hoy" hidden></div>
    <div id="v-agenda" hidden></div>

    <div id="v-tareas" hidden>
      <nav class="solapas chicas">
        <button data-vt="pizarra" aria-selected="true">Pizarra de la semana</button>
        <button data-vt="todas" aria-selected="false">Todas</button>
        <button data-vt="compras" aria-selected="false">Compras</button>
      </nav>
      <form id="form-tarea" class="tarjeta ficha">
        <label>Tarea nueva <input id="nueva-titulo" maxlength="120" required placeholder="Ej.: Llevar a los chicos a la escuela"></label>
        <label>Adentro de <select id="nueva-padre"></select></label>
        <label>Ámbito <select id="nueva-tipo">
          <option value="produccion">Producción</option>
          <option value="mantenimiento">Mantenimiento</option>
          <option value="ninos">Chicos</option>
          <option value="casa">Casa y comida</option>
          <option value="personal">Personal</option>
        </select></label>
        <label class="check"><input type="checkbox" id="nueva-meta" checked> Meta de esta semana (va a la pizarra)</label>
        <label class="check"><input type="checkbox" id="nueva-mia"> Me ocupo yo</label>
        <label class="check"><input type="checkbox" id="nueva-personal"> Sólo la veo yo</label>
        <button class="boton">Agregar</button>
      </form>
      <div id="v-tareas-lista"></div>
    </div>

    <div id="v-chicos" hidden></div>
    <div id="v-plata" hidden></div>
    <div id="v-balance" hidden></div>

    <!-- Los avisos de Claude por WhatsApp (30-sep-2026): el número y el
         consentimiento viven en «Mis avisos» de Casa Verde, porque la gente
         de Tiempos es la misma y el número cargado dos veces sería un dato en
         dos lugares. Ver protocolos/PROTOCOLO-AVISOS.md de datos. -->
    <p class="pie"><a class="link" href="https://casaverdecanas.com.br/interno/avisos.html" target="_blank" rel="noopener">Avisos de Claude por WhatsApp</a>
      · <a class="link" href="https://maurogasta-crypto.github.io/datos/pizarra.html" target="_blank" rel="noopener">📲 La app de los avisos (Pizarra)</a></p>
    <p class="pie"><button class="link" data-salir>Salir</button> <span class="gris">· app-26</span></p>
  </section>
</main>
<script type="module" src="app.js?v=27"></script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
